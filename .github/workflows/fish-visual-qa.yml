name: Fish artwork visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fish_visual_qa.py'
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow numpy opencv-python-headless
      - run: python scripts/fish_visual_qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: fish-visual-review
          path: |
            fish-visual-review.jpg
            fish-visual-review.json
      - name: Save audit to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fish-visual-review.jpg fish-visual-review.json
          git diff --cached --quiet || (git commit -m "Update full fish artwork visual audit" && git push)
