name: Make FishDex images transparent
on:
  push:
    paths:
      - '.github/workflows/transparent-fish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  process-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow numpy
      - run: python scripts/remove_black_backgrounds.py
      - name: Commit transparent WebP assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Crop all 99 fish and remove exterior black backgrounds"
            git push
          fi
