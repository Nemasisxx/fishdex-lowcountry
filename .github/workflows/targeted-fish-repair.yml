name: Targeted fish artwork repair
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/targeted_fish_repair.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow numpy opencv-python-headless
      - run: python scripts/targeted_fish_repair.py
      - name: Commit only targeted fish corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp targeted-fish-repair-report.json
          git diff --cached --quiet || (git commit -m "Clean isolated collage fragments on flagged fish only" && git push)
