name: Audit fish image crops
on:
  push:
    paths:
      - '.github/workflows/audit-fish-crops.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - run: python scripts/audit_fish_crops.py
      - name: Commit audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fish-image-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Audit all 99 fish image crops"
            git push
          fi
