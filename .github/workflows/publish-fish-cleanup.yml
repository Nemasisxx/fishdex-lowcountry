name: Publish fish image cleanup
on:
  push:
    paths:
      - 'scripts/clean_fish_images.py'
      - '.github/workflows/publish-fish-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow numpy opencv-python-headless
      - run: python scripts/clean_fish_images.py
      - name: Commit cleaned fish images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Publish recentered fish artwork and remove stray fragments"
            git push
          fi
