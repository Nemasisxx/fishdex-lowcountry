name: Build FishDex 3D species GLBs
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_species_glbs.py'
      - '.github/workflows/build-species-glbs.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy trimesh
      - run: python scripts/build_species_glbs.py
      - name: Commit generated GLB models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "Generate five species-specific FishDex GLB models"
            git push
          fi
