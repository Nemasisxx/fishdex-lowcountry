<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FishDex Charleston Lowcountry</title><style>body{margin:0;background:#061016;color:#e9faff;font:16px system-ui}header{padding:22px;border-bottom:1px solid #00d8ff}h1{margin:0;color:#00dcff}main{padding:20px;max-width:1250px;margin:auto}input,select,button{padding:10px;border:1px solid #00b9dc;border-radius:8px;background:#091b25;color:white}button{cursor:pointer}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}.card{background:#02080d;border:1px solid #00c7e7;border-radius:8px;padding:12px;text-align:center;cursor:pointer;min-height:150px}.card img{width:100%;height:85px;object-fit:contain}.placeholder{height:85px;display:grid;place-items:center;color:#55727c;font-size:40px}.card strong{display:block}.rarity{font-size:12px;font-weight:700}.dialog{max-width:460px;background:#071b25;color:white;border:1px solid #00d8ff;border-radius:12px;padding:22px}.dialog::backdrop{background:#000b}.dialog label{display:block;margin:10px 0}.dialog input{width:95%;box-sizing:border-box}small{color:#9eb8c3}</style></head><body><header><h1>🐟 FISHDEX</h1><div>CHARLESTON LOWCOUNTRY · 99 SPECIES (22 PROVISIONAL)</div></header><main><p id="stats"></p><p style="color:#a7cbd7;font-size:14px">* Entries #078–#099 are provisional statewide records, not a complete verified Lowcountry inventory. Species #098 is a hybrid, not a separate biological species. <a style="color:#00dcff" href="https://www.dnr.sc.gov/freshwater.html" target="_blank" rel="noopener">SCDNR reference</a></p><div class="toolbar"><input id="search" placeholder="Search species"><select id="player"><option value="Player 1">Player 1</option><option value="Player 2">Player 2</option></select><select id="filter"><option value="all">All species</option><option value="caught">Discovered</option><option value=
